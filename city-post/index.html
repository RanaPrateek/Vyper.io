<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Population: 1 — City Builder Post</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', 'Inter Display', sans-serif; }
  canvas#gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  .layer { position: absolute; inset: 0; pointer-events: none; }

  /* ---- top label + title ---- */
  #pill { position: absolute; top: 236px; left: 50%; transform: translateX(-50%);
    background: #fff; color: #111; font-weight: 800; font-size: 30px; letter-spacing: 0.5px;
    padding: 8px 22px; border-radius: 40px; box-shadow: 0 4px 14px rgba(0,0,0,.25); white-space: nowrap; }
  #title { position: absolute; top: 330px; left: 0; right: 0; text-align: center;
    font-family: 'Inter Display', 'Inter', sans-serif; font-weight: 900; color: #fff; font-size: 100px;
    letter-spacing: 1px; white-space: nowrap; line-height: 1;
    text-shadow: 0 5px 0 rgba(0,0,0,.55), 0 0 22px rgba(0,0,0,.45); }

  /* ---- karaoke captions ---- */
  #caption { position: absolute; top: 1214px; left: 40px; right: 40px; text-align: center;
    font-weight: 800; font-size: 72px; color: #fff; line-height: 1.1; white-space: nowrap;
    paint-order: stroke fill; -webkit-text-stroke: 12px #000;
    text-shadow: 0 6px 10px rgba(0,0,0,.45); }
  #caption .hl { color: #ff8a1c; }

  /* ---- comment card (rule 3) ---- */
  #card { position: absolute; top: 615px; left: 50%; width: 820px; transform: translateX(-50%);
    background: #fff; border-radius: 30px; padding: 26px 34px 30px; box-sizing: border-box;
    box-shadow: 0 18px 40px rgba(0,0,0,.35); display: none; }
  #card .tag { display: inline-block; background: #ff6a13; color: #fff; font-weight: 800; font-size: 20px;
    padding: 4px 14px; border-radius: 20px; letter-spacing: .5px; }
  #card .row { display: flex; align-items: center; margin-top: 16px; }
  #card .av { width: 64px; height: 64px; border-radius: 50%; background: #3a6ee8; color: #fff;
    font-weight: 900; font-size: 32px; display: flex; align-items: center; justify-content: center; flex: none; }
  #card .txt { margin-left: 20px; flex: 1; }
  #card .user { color: #8a8f98; font-size: 24px; font-weight: 600; }
  #card .body { color: #111; font-size: 36px; font-weight: 800; margin-top: 2px; }
  #card .likes { text-align: center; color: #fe2c55; font-weight: 800; font-size: 22px; width: 110px; }
  #card .likes .heart { font-size: 46px; line-height: 1; display: block; }

  /* ---- vote tags (rule: build what first) ---- */
  .vtag { position: absolute; transform: translate(-100%, -50%); background: #ff6a13; color: #fff;
    font-weight: 900; font-size: 40px; padding: 10px 26px; border-radius: 40px; letter-spacing: 1px;
    box-shadow: 0 6px 16px rgba(0,0,0,.3); display: none; white-space: nowrap; }

  /* ---- results row ---- */
  #results { position: absolute; top: 560px; left: 0; right: 0; display: flex; justify-content: space-around; padding: 0 70px; }
  .opt { width: 280px; text-align: center; opacity: 0; }
  .opt .circ { width: 116px; height: 116px; margin: 0 auto; border-radius: 50%; background: #ff6a13; color: #fff;
    font-weight: 900; font-size: 64px; display: flex; align-items: center; justify-content: center;
    border: 6px solid rgba(255,255,255,.9); box-shadow: 0 8px 22px rgba(0,0,0,.35); }
  .opt .lbl { margin-top: 18px; color: #fff; font-weight: 900; font-size: 38px; letter-spacing: 1px;
    text-shadow: 0 4px 0 rgba(0,0,0,.55), 0 0 14px rgba(0,0,0,.4); white-space: nowrap; }

  /* ---- end card ---- */
  #end { position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, #1c2740 0%, #0d121d 70%);
    display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
  #end .k { font-weight: 800; font-size: 34px; color: #ff8a1c; letter-spacing: 6px; }
  #end .big { font-family: 'Inter Display','Inter',sans-serif; font-weight: 900; font-size: 92px; text-align: center; line-height: 1.05; margin: 26px 0 50px; }
  #end .search { display: flex; align-items: center; background: #fff; color: #222; border-radius: 22px;
    padding: 22px 34px; font-size: 40px; font-weight: 700; border: 5px solid #ff8a1c; min-width: 560px; box-sizing: border-box; }
  #end .search svg { margin-right: 22px; }
  #end .pop { margin-top: 60px; font-size: 34px; font-weight: 700; color: #b7c1d6; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div class="layer" id="ui">
    <div id="pill">DAY 0</div>
    <div id="title">POPULATION: 1</div>
    <div id="card">
      <span class="tag">TOP COMMENT</span>
      <div class="row">
        <div class="av">S</div>
        <div class="txt"><div class="user">@sam.builds</div><div class="body">Build a giant stadium</div></div>
        <div class="likes"><span class="heart">&#9829;</span><span id="likeN">0</span></div>
      </div>
    </div>
    <div class="vtag" id="vA">HOSPITAL</div>
    <div class="vtag" id="vB">STADIUM</div>
    <div class="vtag" id="vC">GIANT MALL</div>
    <div id="results">
      <div class="opt" id="oA"><div class="circ">A</div><div class="lbl">HOSPITAL</div></div>
      <div class="opt" id="oB"><div class="circ">B</div><div class="lbl">STADIUM</div></div>
      <div class="opt" id="oC"><div class="circ">C</div><div class="lbl">GIANT MALL</div></div>
    </div>
    <div id="caption"></div>
    <div id="end">
      <div class="k">EPISODE 1 &middot; DAY 0</div>
      <div class="big">FOLLOW TO<br>MOVE IN</div>
      <div class="search">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5 5"/></svg>
        <span id="handle">@your_handle</span>
      </div>
      <div class="pop">Population: <span id="endPop">1</span></div>
    </div>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
